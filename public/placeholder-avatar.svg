      <stop offset="0%" stop-color="#0E121B" />
      <stop offset="50%" stop-color="#07090E" />
      <stop offset="100%" stop-color="#020305" />
    </linearGradient>
    <radialGradient id="avatarGlow" cx="50%" cy="40%" r="45%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="400" height="500" fill="url(#bgAvatar)" />
  <rect width="400" height="500" fill="url(#avatarGlow)" />
  
  <rect x="16" y="16" width="368" height="468" rx="8" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1.5" />

  <g transform="translate(200, 220)" text-anchor="middle">
