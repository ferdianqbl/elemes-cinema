    <circle cx="0" cy="-35" r="50" fill="#0E121B" stroke="#00E5FF" stroke-width="2" stroke-opacity="0.6" />
    <circle cx="0" cy="-45" r="22" fill="#07090E" stroke="#00E5FF" stroke-width="2" />
    <path d="M -30 -5 C -30 -22 -15 -25 0 -25 C 15 -25 30 -22 30 -5 C 30 10 -30 10 -30 -5 Z" fill="#07090E" stroke="#00E5FF" stroke-width="2" />

    <text y="65" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="4">ELEMES CINEMA</text>
    <text y="90" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" letter-spacing="1.5">PROFILE UNAVAILABLE</text>
